<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calypso CMM Training</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; display: flex; height: 100vh; background: #f5f5f5; }
        .sidebar { width: 320px; background: #1e3a8a; color: white; padding: 20px; overflow-y: auto; }
        .main { flex: 1; padding: 20px; overflow-y: auto; background: white; }
        .topic { padding: 12px; cursor: pointer; border-bottom: 1px solid #ccc; }
        .topic:hover, .topic.active { background: #3b82f6; }
        .home-btn { padding: 10px 15px; background: #0066cc; color: white; border: none; border-radius: 6px; margin-bottom: 15px; cursor: pointer; }
        .chapter { padding: 12px; margin: 8px 0; background: #f0f0f0; border-radius: 6px; cursor: pointer; }
        .chapter:hover { background: #ddd; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>Calypso CMM Training</h2>
        <div class="topic" onclick="showAlignments()">Alignments & Part Setup</div>
        <div class="topic" onclick="showBasics()">CMM Basics</div>
    </div>

    <div class="main" id="mainContent">
        <h1>Welcome to Calypso CMM Training</h1>
        <p>Select a topic from the left sidebar.</p>
    </div>

    <script>
        function showHome() {
            document.getElementById('mainContent').innerHTML = `<h1>Welcome to Calypso CMM Training</h1><p>Select a topic from the left sidebar.</p>`;
        }

        function showAlignments() {
            document.getElementById('mainContent').innerHTML = `
                <button class="home-btn" onclick="showHome()">← Home</button>
                <h1>Mastering Datums & CMM Alignments in Calypso</h1>
                <h2>Table of Contents</h2>
                <div class="chapter" onclick="loadChapter(1)">Chapter 1: What is a Datum?</div>
                <div class="chapter" onclick="loadChapter(2)">Chapter 2: Datum Reference Frames (DRF)</div>
                <div class="chapter" onclick="loadChapter(3)">Chapter 3: Datum Types & Their Behavior</div>
                <div class="chapter" onclick="loadChapter(4)">Chapter 4: Establishing Basic Alignments</div>
            `;
        }

        function loadChapter(ch) {
            let html = `<button class="home-btn" onclick="showHome()">← Home</button><h1>Chapter ${ch}</h1>`;
            if (ch === 1) {
                html += `<p><strong>Introduction</strong></p>
                <p>Every measurement needs a reference. In coordinate metrology, that reference is called a datum. Without a consistent reference system, it would be impossible to measure a part with repeatability or to communicate tolerances effectively between design, manufacturing, and quality teams.</p>
                <p>This chapter lays the groundwork for everything that follows. We will define what a datum is, distinguish between the ideal world of geometric dimensioning and tolerancing (GD&T) and the reality of physical parts, and introduce the role of datums in functional design.</p>
                <p><strong>Defining a Datum</strong></p>
                <p>A datum is an ideal, theoretically exact geometric reference from which measurements are made. It can be thought of as an anchor point, axis, or plane. Importantly, the datum itself is never physically touched — what we touch is a datum feature, a physical part surface intended to represent the theoretical datum.</p>
                <p>• Datum: The theoretical, perfect reference.<br>
                • Datum feature: The actual feature (e.g., a machined surface, bore, or slot) intended to establish that datum.<br>
                • Simulated datum: The best-fit geometric element calculated or derived from measurement data to represent the datum during inspection.</p>
                <p><strong>Example:</strong> A flat machined face on a housing may be identified as “Datum A” on a print. The concept of Datum A is the perfect mathematical plane that would exist if the surface had no waviness, no bumps, and no deviation at all. The CMM or inspection fixture creates a simulated plane from the real surface that serves as Datum A for all further measurement.</p>
                <p><strong>Datum Features and Targets</strong></p>
                <p>Not every feature is used as a whole. Sometimes, only certain regions or points on a part are designated to establish a datum. These are called datum targets.</p>
                <p>• Datum feature: The entire bore, surface, or slot acts as a datum.<br>
                • Datum target: Specific areas (pads, points, or lines) define the datum, often used in aerospace, large assemblies, or sheet metal where full-surface contact is not practical.</p>
                <p><strong>Use Case:</strong> Common in aerospace panels, three pads may serve as a functional reference instead of relying on a large, flexible surface. This reduces variability caused by material flexibility and ensures functional alignment.</p>
                <p><strong>Datums in ISO vs. ASME Standards</strong></p>
                <p>While both ISO 5459 and ASME Y14.5 define datums and datum reference frames, they differ in terminology and application details.</p>
                <p><strong>Functional Role of Datums</strong></p>
                <p>Datums are not arbitrary. They are chosen to reflect how a part interfaces with the real world. A proper datum structure:</p>
                <p>1. Stabilizes the part for measurement.<br>
                2. Replicates functional assembly conditions.<br>
                3. Controls degrees of freedom (preventing unwanted translation or rotation).<br>
                4. Provides a consistent reference across the design-manufacturing-inspection pipeline.</p>
                <p><strong>Reality vs. Ideal: Dealing with Imperfections</strong></p>
                <p>No surface is truly flat, no hole is perfectly round, and no feature is manufactured without some deviation. Inspection systems therefore must establish a simulated datum — often a mathematical best-fit plane, axis, or point set derived from measured data points.</p>
                <p><strong>Key Takeaways</strong></p>
                <p>• A datum is the foundation of all geometric measurement.<br>
                • It is theoretical, perfect, and must be represented via a physical feature.<br>
                • Both standards (ISO, ASME) treat datums similarly but with important detail differences.<br>
                • The ultimate goal of a datum system is functional correlation — ensuring measurements match how the part behaves in its real-world assembly.</p>
                <p><strong>Tip:</strong> When in doubt, ask: Does this datum structure represent how the part actually functions? If the answer is no, reconsider the datum selection before proceeding with alignment or inspection.</p>`;
            } else {
                html += `<p>Full content for Chapter ${ch} coming soon. Let me know which chapter to expand next.</p>`;
            }
            document.getElementById('mainContent').innerHTML = html;
        }

        function showBasics() {
            document.getElementById('mainContent').innerHTML = `
                <button class="home-btn" onclick="showHome()">← Home</button>
                <h1>CMM Basics</h1>
                <p>Core principles coming soon.</p>
            `;
        }
    </script>
</body>
</html>
